services:
  forge-audio:
    build: .
    container_name: forge-audio
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      # Comptes, sessions et bibliothèque de chaque utilisateur (playlists, historique, likes…).
      # Aucun fichier audio n'y est stocké.
      - forge-data:/app/data

volumes:
  forge-data:
